name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test

  # On a runner with no image generation, the main step must fail.
  refuses-other-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: action
        uses: ./
        continue-on-error: true
        with:
          name: test-base-image
      - name: The main step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: test "${OUTCOME}" = failure
